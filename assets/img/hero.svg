<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="소행성 단면 일러스트: 위에서부터 우주, 사암 기지, 늪, 얼음과 석유층, 마그마">
  <defs>
    <clipPath id="rock"><path d="M240 28c58 0 96 14 132 42 36 30 64 66 70 116 7 54-10 104-46 144-38 42-92 66-156 66s-116-22-154-62c-36-40-54-92-48-146 6-50 30-88 66-118 36-30 78-42 136-42z"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#e0452f"/><stop offset="1" stop-color="#7a1f2a"/></radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b27c"/><stop offset="1" stop-color="#b98a55"/></linearGradient>
    <linearGradient id="swamp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a9b6e"/><stop offset="1" stop-color="#3d7458"/></linearGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#9be8f5" stop-opacity=".45"/><stop offset="1" stop-color="#60d4e8" stop-opacity=".15"/></radialGradient>
  </defs>

  <!-- 바깥 별 -->
  <g fill="#cfd6ff" opacity=".7">
    <circle cx="30" cy="40" r="1.6"/><circle cx="452" cy="60" r="2"/><circle cx="420" cy="380" r="1.4"/><circle cx="60" cy="370" r="1.8"/><circle cx="470" cy="210" r="1.2"/><circle cx="14" cy="220" r="1.4"/>
  </g>

  <g clip-path="url(#rock)">
    <!-- 우주 -->
    <rect x="0" y="0" width="480" height="100" fill="#141733"/>
    <g fill="#fff" opacity=".8"><circle cx="150" cy="60" r="1.4"/><circle cx="260" cy="48" r="1.8"/><circle cx="330" cy="72" r="1.2"/><circle cx="210" cy="82" r="1"/></g>
    <!-- 레골리스 지표 -->
    <path d="M0 96 Q60 86 120 96 T240 94 T360 98 T480 92 V112 H0z" fill="#8f8aa6"/>
    <!-- 사암 기지층 -->
    <rect x="0" y="110" width="480" height="104" fill="url(#sand)"/>
    <g fill="#c89d66" opacity=".7"><circle cx="70" cy="130" r="6"/><circle cx="410" cy="190" r="7"/><circle cx="380" cy="128" r="4"/></g>
    <!-- 기지 방 (파낸 공간) -->
    <rect x="132" y="122" width="216" height="38" rx="3" fill="#2a2f4f"/>
    <rect x="132" y="166" width="216" height="38" rx="3" fill="#2a2f4f"/>
    <rect x="132" y="160" width="216" height="6" fill="#6d6a7f"/>
    <!-- 사다리 -->
    <g stroke="#f6c445" stroke-width="2"><line x1="236" y1="122" x2="236" y2="204"/><line x1="246" y1="122" x2="246" y2="204"/></g>
    <g stroke="#f6c445" stroke-width="1.6"><line x1="236" y1="130" x2="246" y2="130"/><line x1="236" y1="140" x2="246" y2="140"/><line x1="236" y1="150" x2="246" y2="150"/><line x1="236" y1="174" x2="246" y2="174"/><line x1="236" y1="184" x2="246" y2="184"/><line x1="236" y1="194" x2="246" y2="194"/></g>
    <!-- 윗층: 침대와 조명 -->
    <rect x="150" y="148" width="30" height="8" rx="2" fill="#e0457b"/><rect x="150" y="144" width="8" height="6" rx="2" fill="#fff"/>
    <rect x="190" y="148" width="30" height="8" rx="2" fill="#e0457b"/><rect x="190" y="144" width="8" height="6" rx="2" fill="#fff"/>
    <circle cx="300" cy="128" r="4" fill="#ffe38a"/><path d="M286 160 L300 130 L314 160z" fill="#ffe38a" opacity=".18"/>
    <!-- 연구 책상 -->
    <rect x="290" y="146" width="40" height="10" rx="2" fill="#60d4e8"/><rect x="300" y="138" width="18" height="9" rx="1" fill="#1b5f6e"/>
    <!-- 아랫층: 농장 -->
    <rect x="148" y="198" width="74" height="6" fill="#6b4a2f"/>
    <g fill="#7fd36b"><path d="M156 198c0-10 6-14 6-14s6 4 6 14z"/><path d="M174 198c0-12 6-16 6-16s6 4 6 16z"/><path d="M192 198c0-10 6-14 6-14s6 4 6 14z"/><path d="M210 198c0-11 5-15 5-15s5 4 5 15z"/></g>
    <!-- 산소 확산기 -->
    <rect x="290" y="184" width="22" height="20" rx="4" fill="#9aa3c7"/><rect x="295" y="188" width="12" height="6" rx="2" fill="#5ea86a"/>
    <!-- 복제체 (오리지널 캐릭터) -->
    <g transform="translate(258 170)">
      <rect x="0" y="16" width="16" height="18" rx="6" fill="#e0457b"/>
      <circle cx="8" cy="10" r="10" fill="#ffd9b8"/>
      <path d="M-1 7a9 9 0 0 1 18 0c-3-3-6-4-9-4s-6 1-9 4z" fill="#5b3a2e"/>
      <circle cx="4.6" cy="11" r="1.5" fill="#222"/><circle cx="11.4" cy="11" r="1.5" fill="#222"/>
      <path d="M5.5 15q2.5 2 5 0" stroke="#222" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 늪 -->
    <path d="M0 214 H480 V276 Q420 266 360 276 T240 272 T120 278 T0 270z" fill="url(#swamp)"/>
    <g fill="#2f5a45"><ellipse cx="80" cy="244" rx="16" ry="7"/><ellipse cx="400" cy="236" rx="20" ry="8"/></g>
    <g fill="#a3e3b0" opacity=".6"><circle cx="160" cy="236" r="4"/><circle cx="172" cy="244" r="3"/><circle cx="330" cy="250" r="3.5"/></g>

    <!-- 얼음 (왼쪽) -->
    <path d="M0 268 Q60 262 120 276 L230 284 L210 340 L0 340z" fill="#bfe8f7"/>
    <g fill="#fff" opacity=".7"><path d="M60 290 l8 -14 l8 14z"/><path d="M120 300 l6 -10 l6 10z"/><path d="M170 296 l7 -12 l7 12z"/></g>
    <!-- 석유 (오른쪽) -->
    <path d="M230 284 L360 276 Q420 266 480 270 V340 H210z" fill="#2b2a33"/>
    <ellipse cx="350" cy="306" rx="46" ry="14" fill="#4a3d2a"/><ellipse cx="350" cy="304" rx="40" ry="10" fill="#6d5733" opacity=".7"/>
    <!-- 마그마 -->
    <rect x="0" y="336" width="480" height="100" fill="url(#glow)"/>
    <g fill="#ffd36b" opacity=".8"><circle cx="200" cy="370" r="5"/><circle cx="280" cy="380" r="4"/><circle cx="240" cy="360" r="3"/></g>
  </g>

  <!-- 바위 테두리 -->
  <path d="M240 28c58 0 96 14 132 42 36 30 64 66 70 116 7 54-10 104-46 144-38 42-92 66-156 66s-116-22-154-62c-36-40-54-92-48-146 6-50 30-88 66-118 36-30 78-42 136-42z" fill="none" stroke="#5a4a3a" stroke-width="8"/>

  <!-- 산소 방울 -->
  <g stroke="#60d4e8" stroke-opacity=".6">
    <circle cx="420" cy="110" r="14" fill="url(#bub)"/><circle cx="446" cy="76" r="8" fill="url(#bub)"/><circle cx="54" cy="150" r="10" fill="url(#bub)"/><circle cx="34" cy="116" r="6" fill="url(#bub)"/>
  </g>
</svg>
