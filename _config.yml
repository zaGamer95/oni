# 산소미포함(Oxygen Not Included) 개인 가이드 사이트
# .github/workflows/pages.yml 이 main 푸시 때마다 빌드·배포합니다. (Settings → Pages → Source: GitHub Actions)
title: "산소미포함 생존 노트"
description: "산소미포함(Oxygen Not Included) 초반 가이드 — 지형별 시작, 건설 순서, 바이옴 확장, 건축 규격, 장기 평형"
lang: ko
baseurl: "/oni"
url: "https://wonbo.site"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3

# 사이트에 노출하지 않을 폴더/파일
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _sources
  - CLAUDE.md
  - tools

defaults:
  - scope:
      path: ""
    values:
      layout: default

# 상단 바 버전 배지의 기본값 (_data/versions.yml 의 키). 페이지마다 game_version 으로 덮어쓸 수 있음.
game_version: u60-2026-11-20
