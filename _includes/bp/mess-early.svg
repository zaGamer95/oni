6" fill="#6c7290" font-size="11.16" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">나중에 큰 회관</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">초반: 24×5 자리를 다 파고, 13번에 임시 벽 → 왼쪽 12×5 = 60칸만 식당</text><text x="20" y="221" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="213" width="18" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="72" y="213" width="18" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="90" y="213" width="18" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="108" y="213" width="18" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="126" y="213" width="18" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="149" y="221" fill="#a9b0d0" font-size="10">5칸</text><text x="20" y="238" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 35 × 8칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Mess_Table.png" x="19" y="250" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="262" fill="#e9ecf8" font-size="10.5">식탁 1×1</text><rect x="340" y="252" width="16" height="12" rx="2" fill="#ffe284"/><text x="364" y="262" fill="#e9ecf8" font-size="10.5">13번 = 임시 벽 (나중에 허묾)</text><image href="{{ site.baseurl }}/assets/img/icons/Water_Cooler.png" x="19" y="270" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="282" fill="#e9ecf8" font-size="10.5">워터 쿨러 2×2 (꺼 둠) · 꽃병: 연구되면</text><path d="M340 278 h16 M340 275 v6 M356 275 v6" stroke="#ffd98a" stroke-width="1"/><text x="364" y="282" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="306" fill="#a9b0d0" font-size="10">식당(Mess Hall)은 최대 64칸이라 120칸 그대로면 식당 보너스(+3)가 없음 → 임시 벽으로 60칸.</text><text x="20" y="321" fill="#a9b0d0" font-size="10">식탁 4·6·8·10번 · 쿨러·꽃병은 오른쪽(18~21번)에 연구되면 (점선) · 분쇄기·배급 상자는 서쪽 보관·조리 칸.</text><text x="20" y="338" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
