ont-size="9" text-anchor="middle" font-weight="700">14</text><g class="dim"><path d="M507.5 208 h7 M507.5 312 h7 M511 209 V311" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M511 208.5 l-2.5 5 h5 z M511 311.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="505.71" y="254" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="511" y="263.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><g class="dim"><path d="M507.5 104 h7 M507.5 182 h7 M511 105 V181" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M511 104.5 l-2.5 5 h5 z M511 181.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="497.34" y="137" width="27.32" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="511" y="146.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">터빈 3</text><text x="290" y="178" fill="#6c7290" font-size="12" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">터빈 자리</text><text x="290" y="222" fill="#5fd0ff" font-size="12" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">냉방실 14×4</text><text x="199" y="115" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">증기 터빈 5×3 (7단계)</text><text x="147" y="227.5" fill="#c9d1f0" font-size="12" text-anchor="middle" font-weight="700">⋀</text><text x="173" y="227.5" fill="#c9d1f0" font-size="12" text-anchor="middle" font-weight="700">⋀</text><text x="199" y="227.5" fill="#c9d1f0" font-size="12" text-anchor="middle" font-weight="700">⋀</text><text x="225" y="227.5" fill="#c9d1f0" font-size="12" text-anchor="middle" font-weight="700">⋀</text><text x="251" y="227.5" fill="#c9d1f0" font-size="12" text-anchor="middle" font-weight="700">⋀</text><text x="368" y="271" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">수냉</text><text x="530" y="95" fill="#5fd0ff" font-size="10" text-anchor="start">↑ 기지로 (차가움)</text><text x="530" y="109" fill="#ff8a5c" font-size="10" text-anchor="start">↓ 기지에서 (18°C+)</text><text x="530" y="199" fill="#e9ecf8" font-size="10" text-anchor="start">천장 = 절연 타일</text><text x="530" y="238" fill="#a9b0d0" font-size="10" text-anchor="start">공기·증기층</text><text x="530" y="303" fill="#8fe3ff" font-size="10" text-anchor="start">오염된 물 약 20톤</text><text x="32" y="291" fill="#acffbd" font-size="9.5" text-anchor="start">발전소 ←</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">냉방실 14×4 (+ 위 3칸 증기 터빈 자리)</text><text x="20" y="363" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="355" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="80" y="355" width="26" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="106" y="355" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="132" y="355" width="26" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="158" y="355" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="189" y="363" fill="#a9b0d0" font-size="10">5칸</text><text x="20" y="380" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 19 × 11칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Insulated_Tile.png" x="20" y="393" width="16" height="14" preserveAspectRatio="none"/><text x="44" y="404" fill="#e9ecf8" font-size="10.5">절연 타일 (격벽·냉방실 벽)</text><rect x="347" y="394" width="16" height="12" rx="2" fill="#5a5a2a"/><text x="371" y="404" fill="#e9ecf8" font-size="10.5">오염된 물 (바닥 1줄 + 6칸 ≈ 20톤)</text><path d="M20 420 h16" stroke="#f0e6c8" stroke-width="6" stroke-opacity=".8"/><path d="M20 420 h16" stroke="#ff8a5c" stroke-width="3"/><text x="44" y="424" fill="#e9ecf8" font-size="10.5">돌아오는 냉각수: 절연 액체 파이프</text><path d="M347 420 h16" stroke="#ff5c8a" stroke-width="3.5"/><text x="371" y="424" fill="#e9ecf8" font-size="10.5">방사형 액체 파이프 (터빈 식히기, 7단계 때)</text><path d="M20 440 h16" stroke="#f0e6c8" stroke-width="6" stroke-opacity=".8"/><path d="M20 440 h16" stroke="#5fd0ff" stroke-width="3"/><text x="44" y="444" fill="#e9ecf8" font-size="10.5">식은 냉각수: 절연 액체 파이프 → 기지</text><path d="M347 440 h16" stroke="#ffe284" stroke-width="3.5"/><text x="371" y="444" fill="#e9ecf8" font-size="10.5">터빈이 내보내는 95°C 물 → 액체 배출구</text><path d="M20 460 h16" stroke="#7ad97a" stroke-width="3" stroke-dasharray="4 2"/><text x="44" y="464" fill="#e9ecf8" font-size="10.5">헤비와트 와이어 (벽은 연결판으로)</text><path d="M347 460 h16 M347 457 v6 M363 457 v6" stroke="#ffd98a" stroke-width="1"/><text x="371" y="464" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="488" fill="#a9b0d0" font-size="10">열액체조화기는 바닥 오른쪽(10~11번), 터빈은 왼쪽 위(2~6번). 터빈은 절연 타일 줄 위에 앉고, 그 줄 바로 아래 5칸에서 증기를 빨아들임.</text><text x="20" y="503" fill="#a9b0d0" font-size="10">벽·천장·바닥 = 절연 타일 (16×6 테두리). 오염된 물 ≈ 20톤 = 바닥 1줄 14칸 + 둘째 줄 6칸.</text><text x="20" y="520" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
