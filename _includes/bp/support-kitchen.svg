 y="82.75" width="718.5" height="118.5" fill="none" stroke="#ffe284" stroke-width="1.5"/><rect x="60" y="82" width="210" height="90" fill="#00dcb4" fill-opacity="0.16" stroke="#00dcb4" stroke-width="1.5" stroke-dasharray="4 3"/></g><g class="dim"><path d="M60 63.5 v7 M780 63.5 v7 M61 67 H779" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M60.5 67 l5 -2.5 v5 z M779.5 67 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="411.92" y="61" width="16.16" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="420" y="70.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">24</text><g class="dim"><path d="M41.5 82 h7 M41.5 202 h7 M45 83 V201" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M45 82.5 l-2.5 5 h5 z M45 201.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="39.71" y="136" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="45" y="145.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">주방 24×4 + 조리 도구 (Cooking Tools) 1개</text><text x="20" y="257" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="249" width="30" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="84" y="249" width="30" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="114" y="249" width="30" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="144" y="249" width="30" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="174" y="249" width="30" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="209" y="257" fill="#a9b0d0" font-size="10">5칸</text><text x="242" y="257" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 26 × 6칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Cooking_Tools.png" x="19" y="268" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="280" fill="#e9ecf8" font-size="10.5">조리 도구 (Cooking Tools) 3×1 · 정제 금속 200 kg · 연구 Home Luxuries</text><image href="{{ site.baseurl }}/assets/img/icons/Electric_Grill.png" x="19" y="288" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="300" fill="#e9ecf8" font-size="10.5">향신료 분쇄기 · 전기 그릴 · 가스 레인지(점선 = 나중)</text><image href="{{ site.baseurl }}/assets/img/icons/Refrigerator.png" x="19" y="308" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="320" fill="#e9ecf8" font-size="10.5">냉장고 (범위 밖이어도 됨)</text><rect x="20" y="330" width="16" height="12" rx="2" fill="#00dcb4"/><text x="44" y="340" fill="#e9ecf8" font-size="10.5">조리 도구 효과 범위 7×3</text><path d="M20 356 h16 M20 353 v6 M36 353 v6" stroke="#ffd98a" stroke-width="1"/><text x="44" y="360" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="384" fill="#a9b0d0" font-size="10">조리 도구는 냄비 걸이 모양(3×1)입니다. 천장 바로 아래 1번 줄, 3~5번 칸에 걸면 자기 줄 + 아래 2줄이 범위라,</text><text x="20" y="399" fill="#a9b0d0" font-size="10">향신료 분쇄기 · 전기 그릴 · 가스 레인지 세 대가 한 번에 +15%. 겹치지 않으니 한 조리대 묶음에 1개면 충분.</text><text x="20" y="416" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
