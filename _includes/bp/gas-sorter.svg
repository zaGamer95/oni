MidYMax meet"/></g><path d="M42 280 L162 280" fill="none" stroke="#c9a0ff" stroke-width="3.84" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gas-sorter)"/><path d="M162 136 L162 64 L426 64" fill="none" stroke="#ff7ad9" stroke-width="3.84" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gas-sorter)"/><path d="M210 208 L426 208" fill="none" stroke="#7ad97a" stroke-width="3.84" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gas-sorter)"/><path d="M210 376 L282 376 L282 448" fill="none" stroke="#c8e04a" stroke-width="3.84" stroke-linejoin="round" stroke-linecap="round"/><path d="M162 424 L162 496 L426 496" fill="none" stroke="#9b9b9b" stroke-width="3.84" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gas-sorter)"/><rect x="150.75" y="124.75" width="70.5" height="334.5" fill="none" stroke="#c9a0ff" stroke-width="1.5"/></g><g class="dim"><path d="M150 108.5 v7 M222 108.5 v7 M151 112 H221" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M150.5 112 l5 -2.5 v5 z M221.5 112 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="180.71" y="106" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="186" y="115.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">3</text><g class="dim"><path d="M110.5 124 h7 M110.5 460 h7 M114 125 V459" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M114 124.5 l-2.5 5 h5 z M114 459.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="105.92" y="286" width="16.16" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="114" y="295.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">14</text><g class="dim"><path d="M254.5 124 h7 M254.5 172 h7 M258 125 V171" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M258 124.5 l-2.5 5 h5 z M258 171.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="252.71" y="142" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="258" y="151.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">2</text><g class="dim"><path d="M254.5 364 h7 M254.5 460 h7 M258 365 V459" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M258 364.5 l-2.5 5 h5 z M258 459.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="252.71" y="406" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="258" y="415.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><text x="186" y="150.4" fill="#ff7ad9" font-size="9.5" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">수소</text><text x="186" y="248.8" fill="#7ad97a" font-size="9.5" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">산소·오염 산소</text><text x="186" y="390.4" fill="#c8e04a" font-size="9.5" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">염소</text><text x="186" y="438.4" fill="#d0d0d0" font-size="9.5" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">CO₂</text><text x="162" y="114.4" fill="#e9ecf8" font-size="9" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">P1</text><text x="210" y="186.4" fill="#e9ecf8" font-size="9" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">P2</text><text x="210" y="354.4" fill="#e9ecf8" font-size="9" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">P3</text><text x="162" y="402.4" fill="#e9ecf8" font-size="9" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">P4</text><text x="42" y="234.4" fill="#e9ecf8" font-size="9" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">P0</text><text x="282" y="426.4" fill="#e9ecf8" font-size="9" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">브리지</text><text x="444" y="68" fill="#ff7ad9" font-size="10" text-anchor="start">→ 위쪽 수소 포켓 → 수소 발전기</text><text x="444" y="212" fill="#7ad97a" font-size="10" text-anchor="start">→ 기지로 되돌림 (기체 배출구)</text><text x="444" y="500" fill="#d0d0d0" font-size="10" text-anchor="start">→ 덤프: 기지보다 낮은 웅덩이</text><text x="444" y="514" fill="#a9b0d0" font-size="10" text-anchor="start">   (염소 + CO₂, 무거워서 안 올라옴)</text><text x="32" y="312" fill="#c9a0ff" font-size="9.5" text-anchor="start">← 기지 공기</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">필터 없는 기체 분리탑 (밀도 분리) 3×14</text><text x="20" y="581" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="573" width="24" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="78" y="573" width="24" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="102" y="573" width="24" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="126" y="573" width="24" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="150" y="573" width="24" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="179" y="581" fill="#a9b0d0" font-size="10">5칸</text><text x="20" y="598" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 17 × 21칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Tile.png" x="20" y="611" width="16" height="14" preserveAspectRatio="none"/><text x="44" y="622" fill="#e9ecf8" font-size="10.5">타일 (밀폐 벽)</text><image href="{{ site.baseurl }}/assets/img/icons/Mini_Gas_Pump.png" x="323" y="610" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="348" y="622" fill="#e9ecf8" font-size="10.5">미니 기체 펌프 1×2 · 60 W · 50 g/s</text><path d="M20 638 h16" stroke="#c9a0ff" stroke-width="3.5"/><text x="44" y="642" fill="#e9ecf8" font-size="10.5">섞인 공기 (입구)</text><image href="{{ site.baseurl }}/assets/img/icons/Gas_Bridge.png" x="323" y="630" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="348" y="642" fill="#e9ecf8" font-size="10.5">기체 브리지 1×3</text><path d="M20 658 h16" stroke="#ff7ad9" stroke-width="3.5"/><text x="44" y="662" fill="#e9ecf8" font-size="10.5">수소 줄</text><path d="M324 658 h16" stroke="#7ad97a" stroke-width="3.5"/><text x="348" y="662" fill="#e9ecf8" font-size="10.5">산소·오염된 산소 줄 (되돌림)</text><path d="M20 678 h16" stroke="#c8e04a" stroke-width="3.5"/><text x="44" y="682" fill="#e9ecf8" font-size="10.5">염소 줄</text><path d="M324 678 h16" stroke="#9b9b9b" stroke-width="3.5"/><text x="348" y="682" fill="#e9ecf8" font-size="10.5">CO₂ 덤프 줄</text><path d="M20 698 h16 M20 695 v6 M36 695 v6" stroke="#ffd98a" stroke-width="1"/><text x="44" y="702" fill="#e9ecf8" font-size="10.5">치수선 (칸 수)</text><text x="20" y="726" fill="#a9b0d0" font-size="10">원리: 몰 질량 수소 1.0 &lt; 산소·오염된 산소 16.0 &lt; 염소 34.5 &lt; CO₂ 44.0 (위키 Gas). 가벼운 기체가 위, 무거운 기체가 아래로 층을 이룸.</text><text x="20" y="741" fill="#a9b0d0" font-size="10">필터·원소 센서·무한 저장(액체 속 배출구) 없음. 미니 기체 펌프 5대(입구 포함) × 60 W, 각 50 g/s.</text><text x="20" y="756" fill="#a9b0d0" font-size="10">입구는 50 g/s 이하로. 층이 비면 그 펌프는 옆 층을 빨아들임 → 수소 줄은 위쪽 수소 포켓을 한 번 더 거침(2단 분리).</text><text x="20" y="771" fill="#a9b0d0" font-size="10">염소 줄은 기체 브리지로 CO₂ 덤프 줄에 합류: 브리지 출구가 줄을 따라 오는 흐름보다 우선</text><text x="20" y="786" fill="#a9b0d0" font-size="10">(Klei 포럼 · Pipes &amp; Bridges Priority Cheat Sheet, kleiforums.com/forums/topic/102326).</text><text x="20" y="801" fill="#a9b0d0" font-size="10">산소와 오염된 산소는 무게가 같아서 이 탑으로는 안 나뉨 (둘 다 기지로 되돌림).</text><text x="20" y="818" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
