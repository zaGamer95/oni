.baseurl }}/assets/img/icons/Hatch.png" x="239.3" y="158.6" width="23.4" height="23.4" preserveAspectRatio="xMidYMax meet"/></g><g><title>주둥가리</title><image href="{{ site.baseurl }}/assets/img/icons/Hatch.png" x="265.3" y="158.6" width="23.4" height="23.4" preserveAspectRatio="xMidYMax meet"/></g><g><title>주둥가리</title><image href="{{ site.baseurl }}/assets/img/icons/Hatch.png" x="239.3" y="132.6" width="23.4" height="23.4" preserveAspectRatio="xMidYMax meet"/></g><g><title>주둥가리</title><image href="{{ site.baseurl }}/assets/img/icons/Hatch.png" x="265.3" y="132.6" width="23.4" height="23.4" preserveAspectRatio="xMidYMax meet"/></g><rect x="108.75" y="104.75" width="622.5" height="102.5" fill="none" stroke="#e8c070" stroke-width="1.5"/><rect x="108" y="104" width="208" height="104" fill="none" stroke="#ff8a4c" stroke-width="1.5" stroke-dasharray="4 3"/></g><g class="dim"><path d="M108 217.5 v7 M732 217.5 v7 M109 221 H731" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M108.5 221 l5 -2.5 v5 z M731.5 221 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="411.92" y="215" width="16.16" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="420" y="224.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">24</text><g class="dim"><path d="M91.5 104 h7 M91.5 208 h7 M95 105 V207" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M95 104.5 l-2.5 5 h5 z M95 207.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="89.71" y="150" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="95" y="159.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><g class="dim"><path d="M108 87.5 v7 M316 87.5 v7 M109 91 H315" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M108.5 91 l5 -2.5 v5 z M315.5 91 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="184.39" y="85" width="55.22" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="212" y="94.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">주둥가리 자리 8</text><text x="420" y="118" fill="#e8c070" font-size="12" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">주둥가리 목장 24×4</text><text x="134" y="141" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">손질</text><text x="303" y="153" fill="#e9ecf8" font-size="10" text-anchor="middle" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">자동문</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">실내 목장: 주둥가리 24×4 = 96칸 (8마리 × 12칸)</text><text x="20" y="259" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="251" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="80" y="251" width="26" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="106" y="251" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="132" y="251" width="26" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="158" y="251" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="189" y="259" fill="#a9b0d0" font-size="10">5칸</text><text x="222" y="259" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 29 × 7칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Hatch.png" x="19" y="270" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="282" fill="#e9ecf8" font-size="10.5">주둥가리 8마리 (울타리 안 1~7번)</text><image href="{{ site.baseurl }}/assets/img/icons/Pneumatic_Door.png" x="401" y="270" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="426" y="282" fill="#e9ecf8" font-size="10.5">공압문(자동) = 울타리, 위 2칸은 뚫림</text><image href="{{ site.baseurl }}/assets/img/icons/Grooming_Station.png" x="19" y="290" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="302" fill="#e9ecf8" font-size="10.5">치장스테이션 2×3</text><image href="{{ site.baseurl }}/assets/img/icons/Critter_Feeder.png" x="401" y="290" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="426" y="302" fill="#e9ecf8" font-size="10.5">크리터 사료 공급기 1×2 · 크리터 투하 1×3</text><image href="{{ site.baseurl }}/assets/img/icons/Tile.png" x="20" y="311" width="16" height="14" preserveAspectRatio="none"/><text x="44" y="322" fill="#e9ecf8" font-size="10.5">지은 바닥·벽 타일</text><path d="M402 318 h16 M402 315 v6 M418 315 v6" stroke="#ffd98a" stroke-width="1"/><text x="426" y="322" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="346" fill="#a9b0d0" font-size="10">1~2번 치장스테이션 · 3번 사료 공급기 · 4번 크리터 투하 · 8번 아래 두 칸에 공압문(자동) = 주둥가리 울타리.</text><text x="20" y="361" fill="#a9b0d0" font-size="10">문 위 두 칸은 뚫려 있어 방은 안 나뉨 · 주둥가리는 2칸 높이를 못 넘고 자동 문은 통과 안 함 → 9~24번은 못 오지만 방 칸 수(96)에 들어감.</text><text x="20" y="376" fill="#a9b0d0" font-size="10">알은 바로 방 밖 보관함으로 수거 → 필요한 만큼만 부화 · 석탄은 발전소로 바로.</text><text x="20" y="393" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
