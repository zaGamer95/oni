="174.5" fill="none" stroke="#a9b0d0" stroke-width="1.5"/></g><g class="dim"><path d="M162 290.5 v7 M470 290.5 v7 M163 294 H469" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M162.5 294 l5 -2.5 v5 z M469.5 294 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="310.71" y="288" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="316" y="297.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">7</text><g class="dim"><path d="M488.5 140 h7 M488.5 272 h7 M492 141 V271" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M492 140.5 l-2.5 5 h5 z M492 271.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="486.71" y="200" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="492" y="209.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">3</text><text x="316" y="268" fill="#f4a442" font-size="12" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">기계실 7×3</text><text x="316" y="330" fill="#a9b0d0" font-size="12" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">여유 7×4</text><text x="250" y="151" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">물 정화기 4×3</text><text x="360" y="195" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">모래</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">기계실 7×3 확대 (화장실 동쪽 옆)</text><text x="20" y="385" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="377" width="44" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="98" y="377" width="44" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="142" y="377" width="44" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="186" y="377" width="44" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="230" y="377" width="44" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="279" y="385" fill="#a9b0d0" font-size="10">5칸</text><text x="20" y="402" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 13 × 7칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><path d="M20 422 h16" stroke="#5fb4ff" stroke-width="3.5"/><text x="44" y="426" fill="#e9ecf8" font-size="10.5">물: 정화기 출력구 → 서쪽 벽을 지나 화장실 아래 줄</text><path d="M20 442 h16" stroke="#d8913a" stroke-width="3.5"/><text x="44" y="446" fill="#e9ecf8" font-size="10.5">오염수: 천장 줄(식당 바닥)로 와서 액체 다리 → 정화기 입력구</text><path d="M20 462 h16" stroke="#7ad97a" stroke-width="3" stroke-dasharray="4 2"/><text x="44" y="466" fill="#e9ecf8" font-size="10.5">넘침: 다리 입구 칸에서 가지 → 23번 줄로 내려가 → 22번 수경 재배 타일</text><text x="20" y="490" fill="#a9b0d0" font-size="10">17~20번: 물 정화기 · 21번: 모래 저장 상자(우선순위 높게) · 22번: 수경 재배 타일 위 갈대 · 23번: 지나다니는 칸</text><text x="20" y="505" fill="#a9b0d0" font-size="10">문: 서쪽(16번) = 화장실, 동쪽(24번) = 동쪽 통로. 모래는 동쪽 통로로 들어옴.</text><text x="20" y="522" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
