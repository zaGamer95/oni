baseurl }}/assets/img/icons/Tile.png" x="20" y="591" width="16" height="14" preserveAspectRatio="none"/><text x="44" y="602" fill="#e9ecf8" font-size="10.5">벽·바닥 타일</text><text x="20" y="626" fill="#a9b0d0" font-size="10">통로 3칸 = 식물 칸 1 + 사다리 1 + 소방봉 1. 층 = 내부 4칸 + 바닥 1칸.</text><text x="20" y="643" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
