ext x="44" y="302" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="326" fill="#a9b0d0" font-size="10">아래층 식탁 8 (5~19번 홀수) · 위층 식탁 6 (6~16번 짝수) + 워터 쿨러(꺼 둠, 18~19번) · 꽃병(블러프 브라이어) 2번.</text><text x="20" y="341" fill="#a9b0d0" font-size="10">발판 = 4~21번 칸 3번째 줄 타일 18개, 양 끝 3·22번에 방 안 사다리 · 방 크기 120 − 발판 18 = 102칸 (큰 회관 32~120).</text><text x="20" y="358" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
