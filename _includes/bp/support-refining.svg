aseurl }}/assets/img/icons/Metal_Refinery.png" x="338.04" y="88.04" width="97.92" height="131.92" preserveAspectRatio="xMidYMax meet"/></g><g><title>가마 (Kiln) 2×2</title><rect x="439" y="155" width="66" height="66" rx="2" fill="#ff9a7a" fill-opacity="0.28" stroke="#ff9a7a" stroke-width="1.2"/><image href="{{ site.baseurl }}/assets/img/icons/Kiln.png" x="440.04" y="156.04" width="63.92" height="63.92" preserveAspectRatio="xMidYMax meet"/></g><rect x="64.75" y="86.75" width="474.5" height="134.5" fill="none" stroke="#ff7a5c" stroke-width="1.5"/><rect x="98" y="86" width="374" height="102" fill="#00dcb4" fill-opacity="0.16" stroke="#00dcb4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="166" y="154" width="306" height="68" fill="#00dcb4" fill-opacity="0.16" stroke="#00dcb4" stroke-width="1.5" stroke-dasharray="4 3"/></g><g class="dim"><path d="M64 65.5 v7 M540 65.5 v7 M65 69 H539" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M64.5 69 l5 -2.5 v5 z M539.5 69 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="293.92" y="63" width="16.16" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="302" y="72.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">14</text><g class="dim"><path d="M43.5 86 h7 M43.5 222 h7 M47 87 V221" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M47 86.5 l-2.5 5 h5 z M47 221.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="41.71" y="148" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="47" y="157.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">정제·제련 14×4 + 작업장 도구 (Workshop Tools) · 제련 도구 (Forge Tools)</text><text x="20" y="281" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="273" width="34" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="88" y="273" width="34" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="122" y="273" width="34" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="156" y="273" width="34" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="190" y="273" width="34" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="229" y="281" fill="#a9b0d0" font-size="10">5칸</text><text x="20" y="298" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 16 × 6칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Workshop_Tools.png" x="19" y="310" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="322" fill="#e9ecf8" font-size="10.5">작업장 도구 3×1 · 금속 광석 400 kg + 목재 100 kg · 연구 Plastic Manufacturing</text><image href="{{ site.baseurl }}/assets/img/icons/Forge_Tools.png" x="19" y="330" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="342" fill="#e9ecf8" font-size="10.5">제련 도구 1×2 · 세라믹 600 kg + 정제 금속 200 kg · 연구 Solid Control</text><image href="{{ site.baseurl }}/assets/img/icons/Rock_Crusher.png" x="19" y="350" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="362" fill="#e9ecf8" font-size="10.5">암석 분쇄기 · 제작대 (작업장 도구 호환)</text><image href="{{ site.baseurl }}/assets/img/icons/Metal_Refinery.png" x="19" y="370" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="382" fill="#e9ecf8" font-size="10.5">금속 정제기(점선 = 나중) · 가마 (제련 도구 호환)</text><rect x="20" y="392" width="16" height="12" rx="2" fill="#00dcb4"/><text x="44" y="402" fill="#e9ecf8" font-size="10.5">효과 범위 (위: 작업장 도구 11×3, 아래: 제련 도구 9×2)</text><path d="M20 418 h16 M20 415 v6 M36 415 v6" stroke="#ffd98a" stroke-width="1"/><text x="44" y="422" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="446" fill="#a9b0d0" font-size="10">작업장 도구(선반, 뒷벽 필요)는 6~8번 맨 윗줄 → 범위 좌우 4칸 · 아래 2줄 = 암석 분쇄기 + 제작대.</text><text x="20" y="461" fill="#a9b0d0" font-size="10">제련 도구 1×2는 8번 바닥 → 범위 좌우 4칸 · 자기 2줄 = 금속 정제기 + 가마. 금속 정제기는 배치도보다 2칸 오른쪽(9~11번).</text><text x="20" y="478" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
