239.56" y="131.56" width="74.88" height="48.88" preserveAspectRatio="xMidYMax meet"/></g><g><title>화장실(끔)</title><rect x="317" y="105" width="50" height="76" rx="2" fill="#c0c8e0" fill-opacity="0.28" stroke="#c0c8e0" stroke-width="1.2"/><image href="{{ site.baseurl }}/assets/img/icons/Outhouse.png" x="317.56" y="105.56" width="48.88" height="74.88" preserveAspectRatio="xMidYMax meet"/></g><g><title>식탁 (방 조건용)</title><rect x="369" y="157" width="24" height="24" rx="2" fill="#ffe284" fill-opacity="0.28" stroke="#ffe284" stroke-width="1.2"/><image href="{{ site.baseurl }}/assets/img/icons/Mess_Table.png" x="369.56" y="157.56" width="22.88" height="22.88" preserveAspectRatio="xMidYMax meet"/></g><g opacity=".55"><title>나중: 질병 클리닉 2×3</title><rect x="395" y="105" width="102" height="76" rx="2" fill="#a9b0d0" fill-opacity="0.28" stroke="#a9b0d0" stroke-width="1.2" stroke-dasharray="4 3"/></g><g><title>천정등 1개</title><image href="{{ site.baseurl }}/assets/img/icons/Ceiling_Light.png" x="134" y="78" width="26" height="26" preserveAspectRatio="xMidYMax meet"/></g><rect x="82.75" y="78.75" width="414.5" height="102.5" fill="none" stroke="#ff848e" stroke-width="1.5"/></g><g class="dim"><path d="M82 61.5 v7 M498 61.5 v7 M83 65 H497" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M82.5 65 l5 -2.5 v5 z M497.5 65 l-5 -2.5 v5 z" fill="#ffd98a"/></g><rect x="281.92" y="59" width="16.16" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="290" y="68.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">16</text><g class="dim"><path d="M65.5 78 h7 M65.5 182 h7 M69 79 V181" stroke="#ffd98a" stroke-width="1" fill="none"/><path d="M69 78.5 l-2.5 5 h5 z M69 181.5 l-2.5 -5 h5 z" fill="#ffd98a"/></g><rect x="63.71" y="124" width="10.58" height="12" rx="3" fill="#11131f" stroke="#ffd98a" stroke-width=".8"/><text x="69" y="133.24" fill="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><text x="43" y="101.4" fill="#cfe0ff" font-size="9" text-anchor="middle">텔레</text><text x="43" y="114.4" fill="#cfe0ff" font-size="9" text-anchor="middle">포터</text><text x="290" y="92" fill="#ff848e" font-size="12" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">병원 (Hospital) 16×4</text><text x="121" y="141" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">부상자분류 간이침대</text><text x="199" y="141" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">부상자분류 간이침대</text><text x="277" y="141" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">병상</text><text x="342" y="115" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">화장실(끔)</text><text x="446" y="113.5" fill="#e9ecf8" font-size="8.5" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">나중: 질병 클리닉 2×3</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">Persephazon 병원 · 텔레포터 오른쪽 빈 16×4 방</text><text x="20" y="233" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="225" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="80" y="225" width="26" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="106" y="225" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="132" y="225" width="26" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="158" y="225" width="26" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="189" y="233" fill="#a9b0d0" font-size="10">5칸</text><text x="20" y="250" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 20 × 6칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><rect x="20" y="264" width="16" height="12" rx="2" fill="#4a2830" stroke="#ff848e" stroke-width="1.5"/><text x="44" y="274" fill="#e9ecf8" font-size="10.5">병원 16×4 = 64칸 (12~96칸)</text><image href="{{ site.baseurl }}/assets/img/icons/Triage_Cot.png" x="19" y="282" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="294" fill="#e9ecf8" font-size="10.5">부상자분류 간이침대 3×2: 체력 +50/사이클 (돌봄 받으면 +75), 쓰러진 복제체를 되살림</text><image href="{{ site.baseurl }}/assets/img/icons/Sick_Bay.png" x="19" y="302" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="314" fill="#e9ecf8" font-size="10.5">병상 3×2: 는지렁이허파 치료, 의료 팩 1 kg/회 (Medical Equipment 연구)</text><image href="{{ site.baseurl }}/assets/img/icons/Outhouse.png" x="19" y="322" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="334" fill="#e9ecf8" font-size="10.5">뒷간 2×3: 꺼 둠 (방 조건만 채움)</text><image href="{{ site.baseurl }}/assets/img/icons/Mess_Table.png" x="19" y="342" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="354" fill="#e9ecf8" font-size="10.5">식탁 1×1 (방 조건)</text><image href="{{ site.baseurl }}/assets/img/icons/Insulated_Tile.png" x="20" y="363" width="16" height="14" preserveAspectRatio="none"/><text x="44" y="374" fill="#e9ecf8" font-size="10.5">절연 타일 (지금 있는 벽·바닥)</text><text x="20" y="398" fill="#a9b0d0" font-size="10">병원 조건 (위키): 12~96칸, 의료 침대 1개 이상, 화장실 1개(꺼 둬도 됨), 식탁 1개, 산업 기계 없음.</text><text x="20" y="413" fill="#a9b0d0" font-size="10">병원 안 화장실·식탁은 입원한 복제체만 씀. 병상은 Bedside Manner(간호) 스킬 복제체가 있어야 씀.</text><text x="20" y="430" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
