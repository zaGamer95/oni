#a9b0d0" font-size="10">1칸 = 1타일 · 전체 22 × 7칸 · 눈금 숫자 = 칸 번호, 굵은 선 5칸마다</text><image href="{{ site.baseurl }}/assets/img/icons/Outhouse.png" x="19" y="288" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="300" fill="#e9ecf8" font-size="10.5">간이 화장실 2×3 (나중에 수세식 화장실)</text><image href="{{ site.baseurl }}/assets/img/icons/Wash_Basin.png" x="19" y="308" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="320" fill="#e9ecf8" font-size="10.5">세면기 2×3, 화살표 = 손 씻는 방향 (나가는 쪽)</text><image href="{{ site.baseurl }}/assets/img/icons/Pneumatic_Door.png" x="19" y="328" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="340" fill="#e9ecf8" font-size="10.5">문</text><text x="20" y="364" fill="#a9b0d0" font-size="10">나가는 길이 세면기를 통과하게. 간이 화장실 2×3 ×4 + 세면기 2×3 ×4 = 16칸 + 문 1칸 + 벽 1칸 = 바닥 18칸.</text><text x="20" y="381" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
