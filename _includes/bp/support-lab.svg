ll="#ffd98a" font-size="9" text-anchor="middle" font-weight="700">4</text><text x="420" y="93" fill="#e9ecf8" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">포드 4×4</text><text x="150" y="88" fill="#e0a0ff" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">연구소 +20%</text><text x="615" y="88" fill="#e0a0ff" font-size="10" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#11131f" stroke-width="3" stroke-linejoin="round">슈퍼컴 +20%</text><text x="20" y="22" fill="#e9ecf8" font-size="14" font-weight="700">포드층 연구실 24×4 + 연구 도구 (Study Tools) 8개</text><text x="20" y="257" fill="#e9ecf8" font-size="11" font-weight="700">축척</text><rect x="54" y="249" width="30" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="84" y="249" width="30" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="114" y="249" width="30" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><rect x="144" y="249" width="30" height="8" fill="#11131f" stroke="#cfd3e6" stroke-width=".8"/><rect x="174" y="249" width="30" height="8" fill="#cfd3e6" stroke="#cfd3e6" stroke-width=".8"/><text x="209" y="257" fill="#a9b0d0" font-size="10">5칸</text><text x="242" y="257" fill="#a9b0d0" font-size="10">1칸 = 1타일 · 전체 26 × 6칸 · 눈금 숫자 = 칸 번호, 선: 5칸마다 굵게, 10칸마다 더 굵게</text><image href="{{ site.baseurl }}/assets/img/icons/Study_Tools.png" x="19" y="268" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="280" fill="#e9ecf8" font-size="10.5">연구 도구 (Study Tools) 1×4 · 원석 400 kg + 섬유 2 · 연구 High Culture</text><image href="{{ site.baseurl }}/assets/img/icons/Research_Station.png" x="19" y="288" width="18" height="16" preserveAspectRatio="xMidYMid meet"/><text x="44" y="300" fill="#e9ecf8" font-size="10.5">연구소 2×2 · 슈퍼컴퓨터 3×3 (호환)</text><rect x="20" y="310" width="16" height="12" rx="2" fill="#00dcb4"/><text x="44" y="320" fill="#e9ecf8" font-size="10.5">책장 1개의 효과 범위 (예시 2개만 표시)</text><path d="M20 336 h16 M20 333 v6 M36 333 v6" stroke="#ffd98a" stroke-width="1"/><text x="44" y="340" fill="#e9ecf8" font-size="10.5">치수선 (방 안쪽 칸 수)</text><text x="20" y="364" fill="#a9b0d0" font-size="10">배치도의 연구소(3~4번)·포드(11~14번)·슈퍼컴퓨터(18~20번)는 그대로 두고, 각 연구 건물 양옆 2칸씩 책장 1×4를 세웁니다.</text><text x="20" y="379" fill="#a9b0d0" font-size="10">책장 범위 = 좌우 2칸 · 아래 2줄 (청록 점선). 연구 건물 한 칸이라도 걸리면 +5%, 최대 4개 겹쳐서 +20%.</text><text x="20" y="396" fill="#6c7290" font-size="9">건물·타일 아이콘 © Klei Entertainment · 비공식 팬 가이드</text></svg>
