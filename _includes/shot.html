<figure class="shot{% if include.size %} {{ include.size }}{% endif %}">
  <a href="{{ '/assets/img/shots/' | append: include.src | relative_url }}" target="_blank" rel="noopener"><img src="{{ '/assets/img/shots/' | append: include.src | relative_url }}" alt="{{ include.alt | default: include.caption }}" loading="lazy"></a>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
